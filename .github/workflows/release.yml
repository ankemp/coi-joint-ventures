name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Version.props
          $v = $props.Project.PropertyGroup.JointVenturesVersion
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # -- guard against mismatched tag vs Version.props --
      - name: Validate version matches tag
        shell: pwsh
        run: |
          $tagVersion   = "${{ github.ref_name }}" -replace '^v', ''
          $propsVersion = "${{ steps.version.outputs.version }}"
          if ($tagVersion -ne $propsVersion) {
            throw "Release tag '${{ github.ref_name }}' does not match Version.props ($propsVersion). Update Version.props and push before creating the release."
          }

      # -- pull the plugin DLL built by the push-to-main CI job --
      - name: Download plugin artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          branch: main
          name: plugin-${{ steps.version.outputs.version }}
          path: plugin-artifact

      # -- create plugin bundle zip (embedded in the launcher) --
      - name: Create plugin bundle
        shell: pwsh
        run: |
          $staging = "dist\.staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "plugin-artifact\COIJointVentures.dll" -Destination $staging
          Copy-Item "plugin-artifact\COIJointVentures.pdb" -Destination $staging -ErrorAction SilentlyContinue

          $zipPath = "src\Launcher\plugin-bundle.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Remove-Item $staging -Recurse -Force

      # -- publish launcher (embeds plugin-bundle.zip) --
      - name: Publish launcher
        shell: pwsh
        run: |
          dotnet publish src\Launcher\Launcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist

          $v = "${{ steps.version.outputs.version }}"
          Rename-Item "dist\JointVentures.exe" "JointVentures-v$v.exe"

          Get-ChildItem dist -Filter "*.pdb" | Remove-Item -Force
          Remove-Item "src\Launcher\plugin-bundle.zip" -Force -ErrorAction SilentlyContinue

      # -- copy standalone DLL for manual installs --
      - name: Copy standalone DLL
        shell: pwsh
        run: |
          Copy-Item "plugin-artifact\COIJointVentures.dll" -Destination dist

      # -- attach artifacts to the release that triggered this workflow --
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JointVentures-v${{ steps.version.outputs.version }}.exe
            dist/COIJointVentures.dll
